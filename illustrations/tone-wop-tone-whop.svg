    <circle cx="68" cy="27" r="8"/>
    <path d="M68 35v9 M47 48l20-4 21 4 M52 48l3 25h27l2-25 M47 48l-18 8-17-7 M88 48l18 8 17-7 M55 73l-8 20-2 21-13 2 M82 73l8 18 7 27 14 2"/>
    <circle cx="210" cy="27" r="8"/>
    <path d="M210 35v9 M189 48l20-4 21 4 M194 48l3 25h27l2-25 M189 48l-12 14 23 2 10-8 M230 48l12 14-22 2-10-8 M197 73l-8 20-2 21-13 2 M224 73l10 18-13 26-13-3"/>
    <circle cx="352" cy="27" r="8"/>
