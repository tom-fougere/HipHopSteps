    <circle cx="97" cy="118" r="4"/><circle cx="221" cy="117" r="4"/><circle cx="338" cy="118" r="4"/>
  </g>
  <g fill="#222323" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">
    <text x="68" y="146">1. Petit pas, bras ouverts</text>
    <text x="210" y="146">2. Twist et claque</text>
    <text x="352" y="146">3. Reviens, change</text>
