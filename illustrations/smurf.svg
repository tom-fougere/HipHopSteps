<svg xmlns="http://www.w3.org/2000/svg" width="420" height="168" viewBox="0 0 420 168">
  <title>Smurf classique, version de Buddha Stretch</title>
  <desc>De face, fléchis légèrement les genoux sur le temps. Un bras plié passe souplement devant le buste, puis l’autre prend le relais. Les pieds restent presque en place.</desc>
  <defs>
    <g id="low-body">
      <circle cx="0" cy="43" r="8"/>
      <path d="M0 51v33 M-12 57h24 M-6 84h12 M-6 84l-13 14 3 16h-7 M6 84l13 14-3 16h7"/>
    </g>
    <g id="arms">
      <path d="M-12 57l-7 17 10 8" stroke="#797973"/>
      <path d="M12 57l12 13-20-4" stroke="#185771"/>
      <circle cx="4" cy="66" r="2" fill="#185771" stroke="none"/>
      <path d="M27 53q-3-5-12-5m0 0 5-3m-5 3 4 3" stroke="#185771" stroke-width="1.7"/>
    </g>
  </defs>
  <g fill="none" stroke="#d5cec0">
    <rect x="3" y="8" width="134" height="128" rx="8"/>
    <rect x="143" y="8" width="134" height="128" rx="8"/>
    <rect x="283" y="8" width="134" height="128" rx="8"/>
  </g>
  <g fill="none" stroke="#282a28" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <use href="#low-body" x="70"/>
    <path d="m58 57-7 17 7 10m24-27 7 17-7 10"/>
    <path d="M98 80v20m-4-5 4 5 4-5" stroke="#af3e1d"/>
    <use href="#low-body" x="210"/>
    <use href="#arms" x="210"/>
    <use href="#low-body" x="350"/>
    <use href="#arms" transform="translate(350) scale(-1 1)"/>
  </g>
  <g font-family="system-ui,sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#282a28">
    <text x="70" y="26">Fléchis sur le temps</text>
    <text x="210" y="26">Un bras passe devant</text>
    <text x="350" y="26">L’autre prend le relais</text>
  </g>
  <g font-family="system-ui,sans-serif" font-size="10" font-weight="600">
    <circle cx="109" cy="154" r="3" fill="#af3e1d"/>
    <text x="118" y="158" fill="#282a28">Rebond vers le bas</text>
    <circle cx="236" cy="154" r="3" fill="#185771"/>
    <text x="245" y="158" fill="#282a28">Bras actif</text>
  </g>
</svg>
