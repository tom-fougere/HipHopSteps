<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 182" role="img" aria-labelledby="title desc">
  <title id="title">Cabbage Patch</title>
  <desc id="desc">Vue de dessus en miroir. Les deux poings dessinent ensemble un cercle horizontal devant la poitrine, de droite à devant puis à gauche avant de revenir près du buste. Le talon du côté des mains se lève quand celles-ci passent sur le côté.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#af3e1d"/>
    </marker>
  </defs>
  <g fill="none" stroke="#af3e1d" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M287 79 Q277 43 220 41"/>
    <path d="M201 41 Q141 43 133 74"/>
    <path d="M133 88 Q144 112 198 115"/>
    <path d="M222 115 Q278 112 287 87"/>
  </g>
  <g fill="#185771">
    <circle cx="281" cy="79" r="4"/><circle cx="294" cy="79" r="4"/>
    <circle cx="203" cy="41" r="4"/><circle cx="216" cy="41" r="4"/>
    <circle cx="126" cy="79" r="4"/><circle cx="139" cy="79" r="4"/>
    <circle cx="203" cy="115" r="4"/><circle cx="216" cy="115" r="4"/>
  </g>
  <g fill="none" stroke="#222323" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M194 130 Q209 136 224 130"/>
    <path d="M194 130 185 117 203 115 M224 130 233 117 216 115"/>
    <circle cx="209" cy="140" r="9"/>
  </g>
  <g font-family="system-ui,sans-serif" font-size="13" text-anchor="middle" fill="#222323">
    <text x="209" y="23">2. Tends devant</text>
    <text x="68" y="83">3. À gauche</text>
    <text x="354" y="83">1. À droite</text>
    <text x="209" y="171">4. Ramène près du buste</text>
  </g>
</svg>
