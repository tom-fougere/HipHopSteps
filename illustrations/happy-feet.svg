<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 152" role="img" aria-labelledby="title desc">
  <title id="title">Happy Feet, variante Heel-Toe</title>
  <desc id="desc">Vue de dessus. Pieds à plat, puis pivote à droite sur la pointe gauche et le talon droit. Reviens à plat et pivote à gauche sur le talon gauche et la pointe droite.</desc>
  <defs>
    <path id="foot" d="M-5 2 Q-7 0-6-7 L-5-15 Q-9-26-7-31 Q-5-36 0-36 Q7-36 8-30 Q9-26 5-15 L5-7 Q7 0 4 2Z"/>
    <marker id="toe-arrow" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="m1 1 5 3-5 3" fill="none" stroke="#185771" stroke-width="1.5"/></marker>
    <marker id="heel-arrow" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="m1 1 5 3-5 3" fill="none" stroke="#af3e1d" stroke-width="1.5"/></marker>
  </defs>
  <g fill="none" stroke="#d9d5cb" stroke-width="1">
    <rect x="1" y="1" width="134" height="121" rx="8"/>
    <rect x="143" y="1" width="134" height="121" rx="8"/>
    <rect x="285" y="1" width="134" height="121" rx="8"/>
  </g>
  <g fill="#20211f" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="650">
    <text x="68" y="22">1. À plat</text>
    <text x="210" y="22">2. Vers la droite</text>
    <text x="352" y="22">3. Vers la gauche</text>
  </g>
  <g stroke="#b4aa99" stroke-width="1.25" stroke-dasharray="3 2" fill="none">
    <use href="#foot" transform="translate(193 83) scale(-1 1)"/>
    <use href="#foot" x="227" y="83"/>
    <use href="#foot" transform="translate(335 83) scale(-1 1)"/>
    <use href="#foot" x="369" y="83"/>
  </g>
  <g fill="#f7f3eb" stroke="#20211f" stroke-width="1.75" stroke-linejoin="round">
    <use href="#foot" transform="translate(51 83) scale(-1 1)"/>
    <use href="#foot" x="85" y="83"/>
    <use href="#foot" transform="rotate(36 193 47) translate(193 83) scale(-1 1)"/>
    <use href="#foot" x="227" y="83" transform="rotate(36 227 83)"/>
    <use href="#foot" transform="rotate(-36 335 83) translate(335 83) scale(-1 1)"/>
    <use href="#foot" x="369" y="83" transform="rotate(-36 369 47)"/>
  </g>
  <g fill="#185771">
    <circle cx="193" cy="47" r="4"/>
    <circle cx="369" cy="47" r="4"/>
    <circle cx="106" cy="139" r="4"/>
  </g>
  <g fill="#af3e1d">
    <circle cx="227" cy="83" r="4"/>
    <circle cx="335" cy="83" r="4"/>
    <circle cx="253" cy="139" r="4"/>
  </g>
  <g fill="none" stroke-linecap="round" stroke-width="2">
    <path d="M185 92 Q171 88 164 79 M377 92 Q391 88 398 79" stroke="#185771" marker-end="url(#toe-arrow)"/>
    <path d="M229 37 Q244 36 254 47 M333 37 Q318 36 308 47" stroke="#af3e1d" marker-end="url(#heel-arrow)"/>
  </g>
  <g fill="#20211f" font-family="system-ui, sans-serif" font-size="12">
    <g text-anchor="middle">
      <text x="68" y="110">Orteils devant</text>
      <text x="210" y="110">Pointe G · talon D</text>
      <text x="352" y="110">Talon G · pointe D</text>
    </g>
    <text x="116" y="143">Appui pointe</text>
    <text x="263" y="143">Appui talon</text>
  </g>
</svg>
