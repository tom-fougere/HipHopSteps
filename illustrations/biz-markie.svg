<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 158" role="img" aria-labelledby="title desc">
  <title id="title">Biz Markie, saut et balancier</title>
  <desc id="desc">De face, en miroir, saute en levant un bras. Balance ce bras en diagonale devant le corps. À la réception, remonte les épaules, puis repars de l’autre côté.</desc>
