<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 224" aria-labelledby="title desc">
  <title id="title">Party Machine, quatre appuis en miroir</title>
  <desc id="desc">Pose le pied droit avec le gauche plié derrière, puis saute à droite sur le pied droit et lance le gauche à gauche. Inverse sur les deux appuis suivants. Le pied droit est orange, le gauche bleu.</desc>
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" viewBox="0 0 6 6">
      <path d="M0 0 6 3 0 6Z" fill="#222323"/>
    </marker>
  </defs>
  <g fill="#fffcf6" stroke="#dad4c7">
    <rect x="2" y="2" width="242" height="94" rx="8"/>
    <rect x="256" y="2" width="242" height="94" rx="8"/>
    <rect x="2" y="102" width="242" height="94" rx="8"/>
    <rect x="256" y="102" width="242" height="94" rx="8"/>
  </g>
  <g font-family="system-ui,sans-serif" font-size="15" font-weight="650" fill="#222323" text-anchor="middle">
    <text x="123" y="24">&amp; · Gauche derrière</text>
    <text x="377" y="24">1 · Lance à gauche</text>
    <text x="123" y="124">&amp; · Droit derrière</text>
    <text x="377" y="124">2 · Lance à droite</text>
  </g>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="4">
    <path d="M114 39h19m234 0h19M114 139h19m234 0h19" stroke="#222323"/>
    <path d="M114 39 114 58 141 67h-10m236-28-12 22-32 8-6-3m-184 73 2 21 3 22h7m222-43-2 21-6 22h-8" stroke="#185771"/>
    <path d="M133 39 135 60 138 82h7m241-43 12 21 6 22h7m-278 57 0 19-27 9h10m270-28 12 22 32 8 6-3" stroke="#af3e1d"/>
    <path d="M406 51h26M349 151h-26" stroke="#222323" stroke-width="2" marker-end="url(#arrow)"/>
  </g>
  <path d="M130 87h18m250 0h18m-286 100h18m201 0h18" stroke="#535952" stroke-width="2" stroke-linecap="round"/>
  <g font-family="system-ui,sans-serif" font-size="14" text-anchor="middle">
    <text x="101" y="218" fill="#185771">Jambe gauche</text>
    <text x="250" y="218" fill="#af3e1d">Jambe droite</text>
    <text x="401" y="218" fill="#222323">Sens du saut</text>
  </g>
</svg>
