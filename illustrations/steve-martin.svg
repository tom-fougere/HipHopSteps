  </defs>
  <g fill="none" stroke="#272522" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round">
    <use href="#kick" transform="translate(66 10)"/>
    <use href="#lift" transform="translate(201 10)"/>
    <use href="#kick" transform="translate(336 10)"/>
