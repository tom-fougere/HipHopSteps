  <g fill="#272522" font-family="system-ui,sans-serif" font-size="15" text-anchor="middle">
    <text x="67" y="139">1. Talon</text><text x="67" y="158">gauche derrière</text>
    <text x="202" y="139">2. Genou</text><text x="202" y="158">droit devant</text>
    <text x="337" y="139">3. Talon</text><text x="337" y="158">gauche derrière</text>
    <text x="472" y="139">4. Demi-tour</text><text x="472" y="158">genou gauche</text>
    <text x="270" y="195" font-size="13" fill="#535952">Orange : jambe gauche · bleu : jambe droite · puis inverse les côtés</text>
