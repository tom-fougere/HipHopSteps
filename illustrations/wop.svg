<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 166" role="img" aria-labelledby="title desc">
  <title id="title">The Wop de face</title>
  <desc id="desc">Pieds écartés, fléchis les genoux pendant que les bras remontent ensemble. Redresse-toi sur le rebond en balançant les bras vers le bas.</desc>
  <defs>
    <marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.8" markerHeight="3.8" orient="auto">
      <path fill="#af3e1d" d="m0 0 10 5-10 5z"/>
    </marker>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.8" markerHeight="3.8" orient="auto">
      <path fill="#185771" d="m0 0 10 5-10 5z"/>
    </marker>
  </defs>
  <g fill="#fffaf2" stroke="#dad4c7">
    <rect x="1" y="1" width="201" height="145" rx="9"/>
    <rect x="218" y="1" width="201" height="145" rx="9"/>
  </g>
  <g fill="#222323" font-family="system-ui,sans-serif" font-size="13" font-weight="650" text-anchor="middle">
    <text x="101" y="20">1. Fléchis, bras en haut</text>
    <text x="319" y="20">2. Remonte, bras en bas</text>
  </g>
  <g fill="none" stroke="#262625" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="103" cy="59" r="8"/>
    <path d="M102 67 97 100m-10-23 22 2m-21 21 18 1m-16-1-14 15-5 15h-7m41-29 15 13 5 16h7"/>
    <circle cx="319" cy="46" r="8"/>
    <path d="M319 54 319 92m-11-29 22 2m-19 27 17 1m-16-1-11 18-12 20h-7m46-37 11 17 10 20h7"/>
  </g>
  <g fill="none" stroke="#185771" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M87 77 76 67 79 52m30 27-15-8-7-17M308 63l17 17 18 9m-13-24 12 12 7 12"/>
    <path d="M48 76q1-16 18-22m299 12q8 10 4 25" marker-end="url(#blue)"/>
  </g>
  <g fill="none" stroke="#af3e1d" stroke-width="3" stroke-linecap="round">
    <path d="M152 81v21m225-7V71" marker-end="url(#orange)"/>
  </g>
  <g font-family="system-ui,sans-serif" font-size="11">
    <text x="7" y="161" fill="#185771">Bleu : bras</text>
    <text x="90" y="161" fill="#af3e1d">Orange : rebond du corps</text>
