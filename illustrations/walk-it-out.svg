<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 154" role="img" aria-labelledby="title desc">
  <title id="title">Walk It Out, pivots alternés à droite et à gauche</title>
  <desc id="desc">Deux positions de face. Les genoux restent pliés. À droite, le pied droit marque le pas, les deux pointes et le bassin tournent à droite et le bras droit s'ouvre. À gauche, le pied gauche marque le pas, les deux pointes et le bassin tournent à gauche et le bras gauche s'ouvre.</desc>
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="m0 0 6 3-6 3z" fill="#af3e1d"/></marker>
    <g id="dancer" fill="none" stroke="#25282a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="0" cy="0" r="9" fill="#f7f3eb"/>
      <path d="M0 9v13m-13 0q13 5 26 0M0 22v26m-14 0q14 5 28 0"/>
      <path d="M-13 22l-10 14 10 8 8-7"/>
      <path d="M13 22l13 4 24-3" stroke="#af3e1d"/>
      <circle cx="-23" cy="36" r="3" fill="#25282a" stroke="none"/>
      <circle cx="26" cy="26" r="3" fill="#af3e1d" stroke="none"/>
      <path d="M-14 48l-14 18 13 8-3 15M14 48l-5 17 18 10-1 14"/>
      <circle cx="-28" cy="66" r="3" fill="#25282a" stroke="none"/>
      <circle cx="9" cy="65" r="3" fill="#af3e1d" stroke="none"/>
      <path d="M-18 89l14 2m30-2 14 2" stroke="#af3e1d" stroke-width="4"/>
    </g>
  </defs>
  <g fill="none" stroke="#dad4c7"><rect x="1" y="1" width="204" height="152" rx="10"/><rect x="215" y="1" width="204" height="152" rx="10"/></g>
  <g font-family="system-ui,sans-serif" fill="#25282a" text-anchor="middle">
    <g font-size="13" font-weight="650"><text x="103" y="21">1. Pas droit, tourne à droite</text><text x="317" y="21">2. Pas gauche, tourne à gauche</text></g>
    <g font-size="11"><text x="103" y="144">Genoux fléchis · pointes →</text><text x="317" y="144">Genoux fléchis · pointes ←</text></g>
  </g>
  <use href="#dancer" x="103" y="37"/>
  <use href="#dancer" transform="translate(317 37) scale(-1 1)"/>
  <g fill="none" stroke="#af3e1d" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M69 116q16-9 29 0"/><path d="M107 116q16-9 29 0"/>
    <path d="M351 116q-16-9-29 0"/><path d="M313 116q-16-9-29 0"/>
  </g>
  <g font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#af3e1d" text-anchor="middle"><text x="155" y="109">D</text><text x="266" y="109">G</text></g>
</svg>
