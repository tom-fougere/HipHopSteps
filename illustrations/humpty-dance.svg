      <path d="M-3 41 4 73M-16 50l26-5M-16 50l-12 9-8 10M10 45l17 5 10 8M-7 75l21-4M-7 75l-18 17 2 17h-8"/>
      <path d="M14 71l12 19-3 19h8" stroke="#185771" stroke-width="4.5"/>
    </g>
  </g>
  <g stroke="#af3e1d" stroke-width="2.3" fill="none" marker-end="url(#cue)">
