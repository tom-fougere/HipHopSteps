      <path d="M10 67-3 84l-11 25h-8" stroke="#185771" stroke-width="4.5"/>
    </g>
    <g transform="translate(225 0)">
      <circle cy="36" r="8"/>
      <path d="M0 44v30M-13 54h26M-13 54l-13 9 5 9M13 54l13 9-5 9M-10 74h20M-10 74l-17 16 4 19h-8"/>
      <path d="M10 74l17 16-4 19h8" stroke="#185771" stroke-width="4.5"/>
    </g>
