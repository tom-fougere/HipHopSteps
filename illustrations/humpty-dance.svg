    </marker>
  </defs>
  <g fill="#fffcf6" stroke="#dad4c7">
    <rect x="2" y="2" width="144" height="148" rx="9"/>
    <rect x="153" y="2" width="144" height="148" rx="9"/>
    <rect x="304" y="2" width="144" height="148" rx="9"/>
  </g>
  <g fill="none" stroke="#222323" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(74 0)">
      <circle cy="26" r="8"/>
