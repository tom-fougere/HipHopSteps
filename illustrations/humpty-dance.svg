<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 170" role="img" aria-labelledby="title desc">
  <title id="title">Humpty Dance</title>
  <desc id="desc">Sur le « et », saute et croise le pied droit devant. Au temps 1, reviens pieds écartés et plie les genoux à la réception. Poursuis avec de petits rebonds et accompagne du bassin.</desc>
