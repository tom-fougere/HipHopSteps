<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 155" role="img" aria-labelledby="title desc">
  <title id="title">Bankhead Bounce, épaules et bras</title>
  <desc id="desc">De face, les épaules rebondissent vers le haut pendant que les avant-bras se croisent devant le buste, puis s’ouvrent près du visage.</desc>
  <defs>
    <marker id="up" viewBox="0 0 8 8" refX="4" refY="2" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M1 7 4 2 7 7" fill="none" stroke="#af3e1d" stroke-width="1.5"/>
    </marker>
  </defs>
  <g fill="#fffcf6" stroke="#dad4c7">
    <rect x="1" y="1" width="204" height="128" rx="10"/>
    <rect x="215" y="1" width="204" height="128" rx="10"/>
  </g>
  <g fill="none" stroke="#222323" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="103" cy="37" r="9"/>
    <path d="M103 46v8 M75 63q28-16 56 0 M79 64l7 50h34l7-50 M75 63l-15 20 27 16 18-20 M131 63l14 20-29 16-17-21"/>
    <circle cx="315" cy="37" r="9"/>
    <path d="M315 46v8 M287 63q28-16 56 0 M291 64l7 50h34l7-50 M287 63l-14 20 16 7 12-14 M343 63l14 20-16 7-12-14"/>
  </g>
  <g fill="none" stroke="#af3e1d" stroke-width="2.5" stroke-linecap="round" marker-end="url(#up)">
    <path d="M73 48v-19 M133 48v-19 M285 48v-19 M345 48v-19"/>
  </g>
  <g fill="#185771">
    <circle cx="105" cy="79" r="4"/><circle cx="99" cy="78" r="4"/>
    <circle cx="301" cy="76" r="4"/><circle cx="329" cy="76" r="4"/>
  </g>
  <g fill="#222323" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">
    <text x="103" y="146">1. Croise les bras</text>
    <text x="315" y="146">2. Ouvre sur le rebond</text>
  </g>
</svg>
