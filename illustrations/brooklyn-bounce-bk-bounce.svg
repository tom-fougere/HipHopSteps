<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 154" role="img" aria-labelledby="title desc">
  <title id="title">Brooklyn Bounce, ouvert, croisé et pointes rentrées</title>
  <desc id="desc">Trois cadrages des jambes de face. D'abord les pieds sont écartés avec un petit rebond. Sur le temps, un saut léger croise les jambes et fléchit les genoux. Sur le contretemps, les pieds pivotent et les pointes se rapprochent avant de rouvrir.</desc>
  <g fill="none" stroke="#dad4c7"><rect x="1" y="1" width="134" height="152" rx="10"/><rect x="143" y="1" width="134" height="152" rx="10"/><rect x="285" y="1" width="134" height="152" rx="10"/></g>
  <g font-family="system-ui,sans-serif" fill="#25282a" text-anchor="middle">
    <g font-size="13" font-weight="650"><text x="68" y="22">&amp; · Ouvre</text><text x="210" y="22">1 · Croise</text><text x="352" y="22">&amp; · Pointe dedans</text></g>
    <g font-size="11"><text x="68" y="143">Petit rebond</text><text x="210" y="143">Réception fléchie</text><text x="352" y="143">Puis rouvre sur 2</text></g>
  </g>
