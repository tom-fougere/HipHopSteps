<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 154" role="img" aria-labelledby="title desc">
  <title id="title">Rockaway ou Lean Back, épaule droite rejetée en arrière</title>
  <desc id="desc">Deux vues de profil, orientées vers la droite. Bras croisés et pieds au sol, la première position reste au centre. Sur le temps, l'épaule droite et le buste reculent légèrement, puis reviennent.</desc>
