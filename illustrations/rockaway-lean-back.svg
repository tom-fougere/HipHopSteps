  <g font-family="system-ui,sans-serif" fill="#25282a" text-anchor="middle">
    <g font-size="13" font-weight="650"><text x="103" y="21">1. Centre</text><text x="317" y="21">2. Lean back</text></g>
    <g font-size="11"><text x="103" y="144">Bras croisés · appuis au sol</text><text x="317" y="144">Épaule D en arrière · reviens</text></g>
  </g>
